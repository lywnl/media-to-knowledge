<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="选择本地媒体，查看后端生成的理解结果。">
    <title>本地媒体理解</title>
    <link rel="stylesheet" href="/static/styles.css?v=media-pipelines-2">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">VIDEO UNDERSTANDING</p>
        <h1>看懂一段视频，<br><span>从选择文件开始。</span></h1>
        <p class="header-description">选择一个本地媒体，交给对应的后端流水线完成内容理解。</p>
        <p class="scheduler-note">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 8v4m0 4h.01M10.3 3.7 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/>
          </svg>
          视频、音频和图片任务均由 API 内置阶段调度器自动处理。
        </p>
      </header>

      <section class="panel upload-panel" aria-labelledby="upload-title">
        <div class="section-heading">
            <span class="step-number" aria-hidden="true">01</span>
            <div>
              <h2 id="upload-title">选择媒体</h2>
              <p id="upload-description">视频会进入视频理解流水线，输出章节化 Markdown。</p>
            </div>
        </div>
        <div class="media-kind-selector" role="group" aria-label="选择媒体类型">
          <button class="media-kind is-active" type="button" data-media-kind="VIDEO" aria-pressed="true">视频</button>
          <button class="media-kind" type="button" data-media-kind="AUDIO" aria-pressed="false">音频</button>
          <button class="media-kind" type="button" data-media-kind="IMAGE" aria-pressed="false">图片</button>
        </div>
        <form id="upload-form" novalidate>
          <div class="file-control">
            <label class="file-button" for="video-file">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
              </svg>
              <span id="file-action-label">选择本地视频</span>
            </label>
            <input id="video-file" name="media-file" type="file" accept=".mp4,.mov,.mkv,.webm">
            <p id="file-detail">尚未选择文件</p>
          </div>
          <button id="submit-button" class="primary-button" type="submit">
            <span>开始处理</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
        </form>
      </section>

      <section id="history-panel" class="panel history-panel" aria-labelledby="history-title">
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">02</span>
          <div>
            <h2 id="history-title">历史解析</h2>
            <p>查看当前知识库中已经上传过的视频及其解析文本。</p>
          </div>
          <button id="refresh-history" class="secondary-button" type="button">刷新</button>
        </div>
        <p id="history-status" class="history-status" role="status">正在读取历史记录</p>
        <div id="history-list" class="history-list"></div>
      </section>

      <section id="status-panel" class="panel" aria-labelledby="status-title" hidden>
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">03</span>
          <div>
            <h2 id="status-title">处理状态</h2>
            <p id="status-message" role="status">等待开始</p>
          </div>
        </div>
        <div class="process-track" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <p id="status-detail" class="status-detail"></p>
      </section>

      <p id="error-message" class="error-message" aria-live="polite" hidden></p>

      <section id="result-panel" class="panel" aria-labelledby="result-title" hidden>
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">04</span>
          <div>
            <h2 id="result-title">处理结果</h2>
            <p>后端返回的摘要与分段理解内容。</p>
          </div>
        </div>
        <div id="result-content" class="document-reader">
          <div id="document-overview"></div>
          <nav id="document-toc" aria-label="文档目录"></nav>
          <p id="download-status" class="download-status" role="status"></p>
          <div id="document-chapters"></div>
        </div>
      </section>

    </main>
    <script src="/static/app.js?v=media-pipelines-2" defer></script>
  </body>
</html>
